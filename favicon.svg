<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Loving Embrace creating a warm circular heart silhouette -->
  <!-- Left Person Head (leaning right) -->
  <circle cx="210" cy="155" r="52" fill="#E65100"/>
  <!-- Left Eye gentle smile -->
  <path d="M 220 155 Q 230 163 240 155" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Person Head (leaning left, resting together) -->
  <circle cx="302" cy="155" r="52" fill="#F57C00"/>
  <!-- Right Eye gentle smile -->
  <path d="M 292 155 Q 282 163 272 155" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Bodies merged in warm embrace -->
  <path d="M 140 440 C 130 280 200 230 256 230 C 312 230 382 280 372 440 Z" fill="#FF9800"/>

  <!-- Left Person's Arm wrapping around Right Person -->
  <path d="M 165 270 Q 220 310 320 290 Q 360 280 350 320 Q 310 350 240 330 Q 180 320 165 270 Z" fill="#FFB74D"/>
  
  <!-- Right Person's Arm wrapping around Left Person in a tight loving hug -->
  <path d="M 347 290 Q 292 350 192 330 Q 152 320 162 360 Q 202 390 272 370 Q 332 350 347 290 Z" fill="#FFA726"/>

  <!-- Warm Little Heart of Home glowing above their heads -->
  <path d="M 256 75 C 248 55 220 50 215 70 C 210 95 256 125 256 125 C 256 125 302 95 297 70 C 292 50 264 55 256 75 Z" fill="#FFD54F"/>
</svg>