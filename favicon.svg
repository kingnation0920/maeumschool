<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-ms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#882d1c"/>
      <stop offset="100%" stop-color="#b9442b"/>
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="heart-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow-ms" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg-ms)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#d97757" stroke-width="3" opacity="0.4"/>
  <g filter="url(#glow-ms)">
    <!-- Protective Roof Arch / Two Hands Meeting -->
    <path d="M 124 290 C 130 200 190 148 256 148 C 322 148 382 200 388 290" fill="none" stroke="url(#warm-glow)" stroke-width="24" stroke-linecap="round"/>
    <!-- Left Hand Holding -->
    <path d="M 148 360 C 148 320 180 290 220 290 C 240 290 256 304 256 324" fill="none" stroke="url(#warm-glow)" stroke-width="20" stroke-linecap="round"/>
    <!-- Right Hand Holding -->
    <path d="M 364 360 C 364 320 332 290 292 290 C 272 290 256 304 256 324" fill="none" stroke="url(#warm-glow)" stroke-width="20" stroke-linecap="round"/>
    <!-- Warm Heart at Center -->
    <path d="M 256 220 C 256 200 236 186 218 196 C 200 206 202 230 216 244 L 256 280 L 296 244 C 310 230 312 206 294 196 C 276 186 256 200 256 220 Z" fill="url(#heart-glow)"/>
  </g>
</svg>